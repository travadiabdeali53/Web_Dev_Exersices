<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions</title>  
    <style>
        .container{
            background-color: yellow;
            height: 40vh;
            width: 50vw;
        }
        .box{
            background-color: red;
            height: 4vh;
            width: 5vw;
            transition: transform 3s cubic-bezier(1,-0.02, 0, 0.9) 1s, background-color 3s ease-in-out 1s;
        }

        .translate{
            transform: translateX(10vw) translateY(10vh) scaleX(2);
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box translate"></div>
    </div>
</body>
</html>
