<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: black;
        }

        header{
            position: sticky;
            top: 0;
        }
        nav {
            height: 50px;
            width: 100vw;
            background-color: aqua;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .rectangle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 120px;
            background-color: green;
            height: 500px;
            width: 97vw;
            margin-top: 13px;
        }

        .box1 {
            height: 400px;
            width: 400px;
            background-color: yellow;
        }

        .box2 {
            height: 400px;
            width: 400px;
            background-color: red;
        }

        .card {
            margin-top: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            width: 80vw;
            border: 3px solid white;
            border-radius: 80px;
            font-size: 40px;
            color: white;
        }

        .footer {
            height: 50px;
            width: 100vw;
            background-color: blueviolet;
            margin-top: 150px;
        }

        .ball {
            height: 30px;
            width: 30px;
            background-color: orange;
            position: fixed;
            right: 20px;
            bottom: 10px;
            border-radius: 40px;
        }
    </style>
</head>

<body>
    <header>
        <nav></nav>
    </header>
    <main>
        <div class="rectangle">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="ball"></div>
        <div class="card">
            <p>Welcome To Abdeali Travadi's Youtube Channel A4 Coders</p>
        </div>
        <div class="footer"></div>

    </main>

</body>

</html>
