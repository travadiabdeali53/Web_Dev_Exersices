<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container{
            background-color: yellow;
            height: 60vh;
            width: 80vw;
        }
        .box{
            /* background-color: red; */
            height: 10vh;
            width: 5vw;
            /* animation-name: AbdealiAnimation;
            animation-duration: 3s;
            animation-timing-function: cubic-bezier(0.19, 0, 0, 0.99);
            animation-delay: 1s;
            animation-iteration-count: 1;
            animation-direction: alternate;
            animation-fill-mode: backwards; */
            animation: AbdealiAnimation 3s ease 1s infinite alternate,
            Abdeali 3s ease 1s infinite alternate;
        }

        @keyframes AbdealiAnimation {
            from{
                background-color: red;
            }
            to{
                background-color: blue;
            }
        }

        @keyframes Abdeali {
            0%{
                transform: rotate(20deg)
            }
            20%{ 
                transform: rotate(100deg)
            }
            50%{ 
                transfrorm: rotate(200deg)
            }
            80%{
                transform: rotate(400deg)
            }
            100%{
                transform: rotate(720deg)
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
